spring:
  application:
    name: order-service
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

app:
  jwt:
    # Dev-only fallback (HS256 needs >= 32 bytes). Set JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-order-service-hs256-secret-change-me}
    issuer: order-service
    ttl: 15m
  cache:
    product-ttl: 10m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
