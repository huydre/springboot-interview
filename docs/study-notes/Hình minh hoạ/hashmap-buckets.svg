<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 V100 M0 100 H100" fill="none" stroke="#E4E7EC" stroke-width="1"/>
    </pattern>
    <linearGradient id="back" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4C9DEB"/>
      <stop offset="1" stop-color="#7FBDF4"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#78B8F3"/>
      <stop offset="0.55" stop-color="#9ACBF7"/>
      <stop offset="1" stop-color="#D3E9FC"/>
    </linearGradient>
    <linearGradient id="frontHot" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#A9D4FA"/>
      <stop offset="0.6" stop-color="#D2E9FD"/>
      <stop offset="1" stop-color="#F2F8FE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2F78C2" flood-opacity="0.20"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2F78C2" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A97A8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3B86D6"/>
    </marker>

    <!-- reusable folder parts (local box 300 x 220) -->
    <path id="folderBack" d="M14 0 H102 Q110 0 115 6 L126 22 H286 Q300 22 300 36 V206 Q300 220 286 220 H14 Q0 220 0 206 V14 Q0 0 14 0 Z"/>
    <path id="folderFront" d="M0 104 Q0 90 14 90 H286 Q300 90 300 104 V206 Q300 220 286 220 H14 Q0 220 0 206 Z"/>
    <g id="paper">
      <rect x="0" y="0" width="200" height="130" rx="7" fill="#FFFFFF"/>
      <rect x="18" y="20" width="110" height="8" rx="4" fill="#D9E2EC"/>
      <rect x="18" y="38" width="150" height="8" rx="4" fill="#E6ECF2"/>
    </g>
    <g id="dots">
      <circle cx="276" cy="112" r="2.6" fill="#FFFFFF"/><circle cx="276" cy="121" r="2.6" fill="#FFFFFF"/><circle cx="276" cy="130" r="2.6" fill="#FFFFFF"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="900" fill="#F4F5F7"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- headline -->
  <g fill="#1F2328" text-anchor="end">
    <text x="1130" y="84" font-size="32">HashMap không đi tìm từng phần tử.</text>
    <text x="1130" y="128" font-size="32">Nó tính ra đúng ngăn cần mở.</text>
    <text x="1130" y="206" font-size="50" font-weight="500" letter-spacing="-1.5">HASH → BUCKET → EQUALS.</text>
  </g>

  <!-- ===== lookup pipeline: get("an") ===== -->
  <g font-size="19" font-family="'SF Mono', Menlo, Consolas, monospace">
    <g filter="url(#chipShadow)">
      <rect x="60" y="266" width="150" height="48" rx="24" fill="#FFFFFF"/>
      <rect x="250" y="266" width="160" height="48" rx="24" fill="#FFFFFF"/>
      <rect x="450" y="266" width="200" height="48" rx="24" fill="#FFFFFF"/>
      <rect x="690" y="266" width="160" height="48" rx="24" fill="#3B86D6"/>
      <rect x="890" y="266" width="240" height="48" rx="24" fill="#E7F6EC"/>
    </g>
    <text x="135" y="297" text-anchor="middle" fill="#2F6FAE">get("an")</text>
    <text x="330" y="297" text-anchor="middle" fill="#2F6FAE">hashCode()</text>
    <text x="550" y="297" text-anchor="middle" fill="#2F6FAE">(n − 1) &amp; hash</text>
    <text x="770" y="297" text-anchor="middle" fill="#FFFFFF" font-weight="600">bucket [2]</text>
    <text x="1010" y="297" text-anchor="middle" fill="#1E7A43">equals ✓ → 25</text>
    <g stroke="#8A97A8" stroke-width="2" marker-end="url(#arrow)">
      <line x1="214" y1="290" x2="244" y2="290"/>
      <line x1="414" y1="290" x2="444" y2="290"/>
      <line x1="654" y1="290" x2="684" y2="290"/>
      <line x1="854" y1="290" x2="884" y2="290"/>
    </g>
    <text x="60" y="246" font-size="15" fill="#8A97A8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">CÁCH HASHMAP TÌM MỘT KEY</text>
  </g>

  <!-- ===== [0] empty bucket (dimmed) ===== -->
  <g transform="translate(50 430) skewY(-9)" filter="url(#shadow)" opacity="0.55">
    <use href="#folderBack" fill="url(#back)"/>
    <use href="#folderFront" fill="url(#front)"/>
    <use href="#folderFront" fill="url(#glow)"/>
    <text x="24" y="150" font-size="24" fill="#2F6FAE">[0]  null</text>
  </g>

  <!-- ===== [1] one node ===== -->
  <g transform="translate(205 515) skewY(-9)" filter="url(#shadow)">
    <use href="#folderBack" fill="url(#back)"/>
    <use href="#paper" transform="translate(50 40)"/>
    <use href="#folderFront" fill="url(#front)"/>
    <use href="#folderFront" fill="url(#glow)"/>
    <text x="24" y="150" font-size="24" fill="#2F6FAE">[1]  Node C</text>
  </g>

  <!-- ===== [3] empty bucket (dimmed) ===== -->
  <g transform="translate(660 600) skewY(-9)" filter="url(#shadow)" opacity="0.55">
    <use href="#folderBack" fill="url(#back)"/>
    <use href="#folderFront" fill="url(#front)"/>
    <use href="#folderFront" fill="url(#glow)"/>
    <text x="24" y="150" font-size="24" fill="#2F6FAE">[3]  null</text>
  </g>

  <!-- "..." between [3] and [15] -->
  <text x="985" y="585" font-size="30" fill="#9AA8B8" letter-spacing="4">…</text>

  <!-- ===== [15] crowded bucket became a tree ===== -->
  <g transform="translate(870 640) skewY(-9)" filter="url(#shadow)">
    <use href="#folderBack" fill="url(#back)"/>
    <use href="#paper" transform="translate(40 30)"/>
    <use href="#paper" transform="translate(52 40)"/>
    <use href="#paper" transform="translate(64 50)"/>
    <use href="#folderFront" fill="url(#front)"/>
    <use href="#folderFront" fill="url(#glow)"/>
    <text x="24" y="146" font-size="23" fill="#2F6FAE">[15]  TreeNode</text>
    <text x="24" y="176" font-size="16" fill="#5B8FC2">&gt; 8 node &amp; table ≥ 64</text>
    <g transform="translate(234 98)" stroke="#5B8FC2" stroke-width="2">
      <line x1="20" y1="6" x2="8" y2="26"/><line x1="20" y1="6" x2="32" y2="26"/>
      <circle cx="20" cy="6" r="6" fill="#FFFFFF"/><circle cx="8" cy="28" r="6" fill="#F7B3B3"/><circle cx="32" cy="28" r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ===== [2] featured bucket: collision → linked list ===== -->
  <g transform="translate(400 470) scale(1.15) skewY(-9)" filter="url(#shadow)">
    <use href="#folderBack" fill="url(#back)"/>
    <g transform="translate(-6 -62) rotate(-5)">
      <use href="#paper"/>
      <text x="18" y="78" font-size="19" font-weight="700" fill="#2F6FAE">Node A</text>
      <text x="18" y="100" font-size="14" fill="#5B8FC2">key "an" · value 25</text>
      <text x="18" y="118" font-size="14" fill="#5B8FC2">next → Node B</text>
    </g>
    <g transform="translate(186 -52) rotate(4)">
      <use href="#paper"/>
      <text x="18" y="78" font-size="19" font-weight="700" fill="#2F6FAE">Node B</text>
      <text x="18" y="100" font-size="14" fill="#5B8FC2">key "binh" · value 30</text>
      <text x="18" y="118" font-size="14" fill="#5B8FC2">next → null</text>
    </g>
    <use href="#folderFront" fill="url(#frontHot)"/>
    <use href="#folderFront" fill="url(#glow)"/>
    <text x="24" y="146" font-size="23" fill="#2F6FAE">[2]  collision</text>
    <text x="24" y="178" font-size="15" fill="#5B8FC2">trùng ngăn → nối list → so equals()</text>
    <use href="#dots"/>
  </g>

  <!-- dashed pointer from "bucket [2]" chip into the opened folder -->
  <path d="M770 318 C 770 352, 620 340, 560 372" fill="none" stroke="#3B86D6" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowBlue)"/>

  <!-- footer facts -->
  <text x="50" y="872" font-size="19" fill="#6B7280">capacity 16  ·  load factor 0.75  ·  resize ở phần tử thứ 13  ·  index = (n − 1) &amp; hash</text>
</svg>
